    }

      font-style: italic;
      color: #666;
      font-size: 0.9rem;
    }

      position: absolute;
      width: 10px;
      height: 10px;
      background-color: white;
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
    }

      margin-top: 3rem;
      font-size: 0.8rem;
      color: #666;
    }
    
    /* Animation classes */
    .cookie-opened .cookie-top {
      transform: translateY(-50px) rotateX(45deg);
      opacity: 0.8;
    }
    
    .cookie-opened .cookie-bottom {
      transform: translateY(50px) rotateX(-45deg);
      opacity: 0.8;
    }
    
    .cookie-opened .fortune-paper {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
      z-index: 1;
    }
    
    .cookie-opened .fortune-text,
    .cookie-opened .category-tag,
    .cookie-opened .actions {
      opacity: 1;
      transform: translateY(0);
    }
    
    .cookie-opened .btn-new {
      display: inline-block;
    }
    
    /* Sparkle animation */
    @keyframes sparkle {
      0% {
        transform: scale(0) rotate(0deg);
        opacity: 0;
      }
      50% {
        transform: scale(1) rotate(180deg);
        opacity: 1;
      }
      100% {
        transform: scale(0) rotate(360deg);
        opacity: 0;
      }
    }
    
    /* Responsive styles */
    @media (max-width: 768px) {
      .container {
        padding: 1rem;
      }
      
      h1 {
        font-size: 2rem;
      }
      
      .fortune-container {
        width: 250px;
        height: 250px;
      }
      
      .fortune-text {
        font-size: 1rem;
      }
    }
    
    @media (max-width: 480px) {
      h1 {
        font-size: 1.8rem;
      }
      
      .subtitle {
        font-size: 1rem;
      }
      
      .fortune-container {
        width: 200px;
        height: 200px;
      }
      
      .fortune-paper {
        padding: 1rem;
      }
    }

      // Get a random fortune tip
      function getRandomFortune() {
        if (fortuneTips.length === 0) {
          return {
            tip: "Wisdom comes to those who are patient.",
            category: "wisdom"
          };
        }
        
        const randomIndex = Math.floor(Math.random() * fortuneTips.length);
        return fortuneTips[randomIndex];
      }
      
      // Create sparkle elements
      function createSparkles() {
        const container = document.querySelector('.fortune-container');
        const sparkleCount = 15;
        
        for (let i = 0; i < sparkleCount; i++) {
          const sparkle = document.createElement('div');
          sparkle.classList.add('sparkle');
          
          // Random position around the cookie
          const angle = Math.random() * Math.PI * 2;
          const distance = 100 + Math.random() * 50;
          const x = Math.cos(angle) * distance;
          const y = Math.sin(angle) * distance;
          
          sparkle.style.left = `calc(50% + ${x}px)`;
          sparkle.style.top = `calc(50% + ${y}px)`;
          
          // Random size
          const size = 5 + Math.random() * 10;
          sparkle.style.width = `${size}px`;
          sparkle.style.height = `${size}px`;
          
          // Random color
          const colors = ['#F2C94C', '#EB5757', '#4ECDC4', '#ffffff'];
          sparkle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          
          // Random animation duration
          const duration = 0.5 + Math.random() * 1;
          sparkle.style.animation = `sparkle ${duration}s ease-in-out forwards`;
          
          container.appendChild(sparkle);
          
          // Remove sparkle after animation
          setTimeout(() => {
            sparkle.remove();
          }, duration * 1000);
        }
      }
      
      // Typewriter effect for fortune text
      function typeWriter(text, element, speed = 50) {
        let i = 0;
        element.textContent = '';
        
        function type() {
          if (i < text.length) {
            element.textContent += text.charAt(i);
            i++;
            setTimeout(type, speed);
          }
        }
        
        type();
      }
      
      // Open cookie and show fortune
      function openCookie() {
        if (cookie.parentElement.classList.contains('cookie-opened')) {
          return;
        }
        
        // Play crack sound
        const crackSound = new Audio('data:audio/wav;base64,UklGRtQFAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YbAFAACAgICAgICAgICAgICAgICAgICAgICAgICAf3hxeH+AfXZ1eHx6fH58e3p5fYGFg4GEgIGJhIWJio2Oi4qKiYyQkpKQj4+PjpCRlZmYlJOTkpOVmJqbl5WVlZWYm52enJqZmJqeo6Wmo6CgoKCjqKuuraupqams...'); // Base64 encoded sound
        crackSound.volume = 0.5;
        crackSound.play().catch(e => console.log('Audio play failed:', e));
        
        // Add open class
        cookie.parentElement.classList.add('cookie-opened');
        
        // Create sparkle effect
        createSparkles();
        
        // Show fortune with typewriter effect
        setTimeout(() => {
          const fortune = getRandomFortune();
          typeWriter(fortune.tip, fortuneText);
          categoryTag.textContent = fortune.category;
        }, 800);
      }
      
      // Reset cookie for new fortune
      function resetCookie() {
        cookie.parentElement.classList.remove('cookie-opened');
        fortuneText.textContent = "Click the cookie to reveal your fortune...";
        categoryTag.textContent = "wisdom";
        
        // Allow time for animation to complete
        setTimeout(() => {
          cookie.style.pointerEvents = 'auto';
        }, 500);
openCookie();
      }
      
      // Event listeners
      cookie.addEventListener('click', function() {
        openCookie();
        cookie.style.pointerEvents = 'none'; // Prevent multiple clicks
      });
      
      newFortuneBtn.addEventListener('click', resetCookie);
